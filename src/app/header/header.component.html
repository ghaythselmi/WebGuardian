<nav class="navbar" [class.navbar-hidden]="!navbarVisible">
  <div class="navbar-container">

    <!-- Logo / Brand -->
    <a [routerLink]="mode === 'client' ? ['/home'] : ['/h']" class="navbar-brand">
      <div class="brand-icon">
        <img class="brand-icon-image" src="/assets/img/webguardian-neon-shield-app-icon.png" alt="" aria-hidden="true">
      </div>
      <span class="brand-name">Web<span>Guardian</span></span>
    </a>

    <!-- PUBLIC mode -->
    <ng-container *ngIf="mode === 'public'">
      <div class="navbar-links">
        <a href="/h#home" (click)="navigateToSection($event, 'home')" class="nav-link">Home</a>
        <a href="/h#how-it-works" (click)="navigateToSection($event, 'how-it-works')" class="nav-link">Features</a>
        <a href="/h#contact" (click)="navigateToSection($event, 'contact')" class="nav-link">Contact</a>
      </div>
      <div class="navbar-actions">
        <a routerLink="/login" class="nav-link btn-outline">Login</a>
        <a routerLink="/register" class="nav-link btn-filled">Sign Up</a>
      </div>
    </ng-container>

    <!-- CLIENT mode -->
    <ng-container *ngIf="mode === 'client'">
      <div class="navbar-links">
        <a routerLink="/home" class="nav-link">
          <i class="fas fa-home"></i> Home
        </a>
        <a href="/home#website-list" (click)="navigateToSection($event, 'website-list')" class="nav-link">
          <i class="fas fa-globe"></i> Monitored Websites
        </a>
        <a routerLink="/stats" class="nav-link" routerLinkActive="active">
          <i class="fas fa-chart-bar"></i> Stats
        </a>
      </div>
      <div class="navbar-actions">
        <!-- User Menu Button -->
        <div class="user-menu" (click)="toggleDropdown($event)">
          <i class="fas fa-user-circle user-icon"></i>
          <span class="user-name">{{ (user && user.username) ? user.username : 'Loading...' }}</span>
          <i class="fas fa-chevron-down chevron" [class.chevron-open]="dropdownVisible"></i>
        </div>
        
        <!-- Dropdown Menu -->
        <div class="user-dropdown-menu" *ngIf="dropdownVisible" (click)="$event.stopPropagation()">
          <a routerLink="/profile" class="user-dropdown-item" (click)="dropdownVisible = false">
            <i class="fas fa-user"></i> Profile
          </a>
          <div class="dropdown-divider"></div>
          <a href="#" (click)="logout(); $event.preventDefault(); dropdownVisible = false" class="user-dropdown-item">
            <i class="fas fa-sign-out-alt"></i> Logout
          </a>
        </div>
      </div>
    </ng-container>

  </div>
</nav>
