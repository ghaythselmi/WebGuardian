<nav class="navbar" [class.navbar-hidden]="!navbarVisible">
  <div class="navbar-container">

    <!-- Logo / Brand -->
    <a [routerLink]="mode === 'client' ? ['/home'] : ['/h']" class="navbar-brand">
      <div class="brand-icon">
        <img class="brand-icon-image" src="/assets/img/webguardian-neon-shield-app-icon.png" alt="" aria-hidden="true">
      </div>
      <span class="brand-name">Web<span>Guardian</span></span>
    </a>

    <!-- PUBLIC mode -->
    <ng-container *ngIf="mode === 'public'">
      <div class="navbar-links">
        <a href="/h#home" (click)="navigateToSection($event, 'home')" class="nav-link">Home</a>
        <a href="/h#how-it-works" (click)="navigateToSection($event, 'how-it-works')" class="nav-link">Features</a>
        <a href="/h#contact" (click)="navigateToSection($event, 'contact')" class="nav-link">Contact</a>
      </div>
      <div class="navbar-actions">
        <a routerLink="/login" class="nav-link btn-outline">Login</a>
        <a routerLink="/register" class="nav-link btn-filled">Sign Up</a>
      </div>
    </ng-container>

    <!-- CLIENT mode -->
    <ng-container *ngIf="mode === 'client'">
      <div class="navbar-links">
        <a routerLink="/home" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="fas fa-home"></i> Home
        </a>
        <a href="/home#website-list" (click)="navigateToSection($event, 'website-list')" class="nav-link">
          <i class="fas fa-globe"></i> Monitored Websites
        </a>
        <a routerLink="/stats" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="fas fa-chart-bar"></i> Stats
        </a>
      </div>
      <div class="navbar-actions">
        <div class="notification-control">
          <button type="button" class="notification-bell" aria-label="Website notifications" [attr.aria-expanded]="notificationsOpen" (click)="toggleNotifications($event)">
            <i class="fas fa-bell" aria-hidden="true"></i>
            <span *ngIf="unreadNotificationCount" class="notification-count">{{ unreadNotificationCount > 9 ? '9+' : unreadNotificationCount }}</span>
          </button>
          <div *ngIf="notificationsOpen" class="notification-popover" (click)="$event.stopPropagation()">
            <div class="notification-popover-heading">
              <div><strong>Notifications</strong><span *ngIf="unreadNotificationCount">{{ unreadNotificationCount }} unread</span></div>
              <button type="button" class="notification-refresh" aria-label="Refresh notifications" (click)="loadNotifications()"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div *ngIf="notifications.length === 0" class="notification-empty">
              <i class="far fa-bell-slash" aria-hidden="true"></i>
              <span>No website alerts yet</span>
            </div>
            <button *ngFor="let notification of notifications" type="button" class="notification-item" [class.unread]="!notification.read" (click)="markNotificationRead(notification)">
              <span class="notification-status-icon" [class.recovered]="notification.type === 'website_recovered'"><i class="fas" [class.fa-exclamation-triangle]="notification.type === 'website_down'" [class.fa-check]="notification.type === 'website_recovered'"></i></span>
              <span class="notification-copy"><strong>{{ notification.title }}</strong><span>{{ notification.message }}</span><small>{{ notification.createdAt | date:'short' }}</small></span>
              <span *ngIf="!notification.read" class="notification-unread-dot" aria-label="Unread"></span>
            </button>
          </div>
        </div>
        <!-- User Menu Button -->
        <div class="user-menu" (click)="toggleDropdown($event)">
          <i class="fas fa-user-circle user-icon"></i>
          <span class="user-name">{{ (user && user.username) ? user.username : 'Loading...' }}</span>
          <i class="fas fa-chevron-down chevron" [class.chevron-open]="dropdownVisible"></i>
        </div>
        
        <!-- Dropdown Menu -->
        <div class="user-dropdown-menu" *ngIf="dropdownVisible" (click)="$event.stopPropagation()">
          <a routerLink="/profile" class="user-dropdown-item" (click)="dropdownVisible = false">
            <i class="fas fa-user"></i> Profile
          </a>
          <div class="dropdown-divider"></div>
          <a href="#" (click)="logout(); $event.preventDefault(); dropdownVisible = false" class="user-dropdown-item">
            <i class="fas fa-sign-out-alt"></i> Logout
          </a>
        </div>
      </div>
    </ng-container>

  </div>
</nav>
